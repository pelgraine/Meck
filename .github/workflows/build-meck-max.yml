name: Build T-Deck MAX Firmwares

# Builds the T-Deck MAX firmwares of this fork.
# - every push to `next` and every pull request into `next` or `testing`: the
#   firmwares are kept as workflow artifacts for 30 days (Actions tab > run >
#   Artifacts)
# - every push to `next`: the pre-release "Latest build (next)" (tag
#   `next-latest`) is replaced with the new firmwares
# - a tag `max-v*` (e.g. max-v1.15.1): also a draft GitHub release with the
#   firmwares attached, published by hand after a look
# - "Run workflow" on the Actions tab builds any branch on demand

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    branches:
      - next
    tags:
      - 'max-v*'
  pull_request:
    branches:
      - next
      - testing

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env:
          - meck_max_ui2            # new UI, Bluetooth and WiFi companion
          - meck_max_ble_wifi       # classic UI, Bluetooth and WiFi companion
          - meck_max_standalone     # classic UI, no phone connection
    steps:

      - name: Clone Repo
        uses: actions/checkout@v4

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment

      - name: Build ${{ matrix.env }}
        run: pio run -e ${{ matrix.env }}

      # firmware-merged.bin: first flash, written at 0x0 (bootloader, partitions,
      # app and an empty file system); firmware.bin: app only, for updates
      # (OTA, Launcher, or 0x10000)
      - name: Collect Binaries
        shell: bash
        run: |
          mkdir -p out
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then VER="${GITHUB_REF#refs/tags/}"; else VER="$(git rev-parse --short HEAD)"; fi
          cp .pio/build/${{ matrix.env }}/firmware.bin        out/${{ matrix.env }}-${VER}.bin
          cp .pio/build/${{ matrix.env }}/firmware-merged.bin out/${{ matrix.env }}-${VER}-merged.bin

      - name: Upload Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.env }}
          path: out
          retention-days: 30

  # Every push to next replaces one pre-release, tag `next-latest`, with the
  # new binaries (fixed file names), so the newest build always has a
  # permanent link. Versioned releases (max-v*) are separate and kept.
  latest:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/next'
    runs-on: ubuntu-latest
    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: in
          merge-multiple: true

      - name: Fixed File Names
        shell: bash
        run: |
          mkdir -p out
          for f in in/*.bin; do
            b=$(basename "$f")
            env=${b%%-*}
            if [[ "$b" == *-merged.bin ]]; then cp "$f" "out/${env}-merged.bin"; else cp "$f" "out/${env}.bin"; fi
          done
          ls -l out

      - name: Remove the Previous Latest Build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete next-latest --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag || true

      - name: Publish Latest Build
        uses: softprops/action-gh-release@v2
        with:
          tag_name: next-latest
          target_commitish: ${{ github.sha }}
          name: Latest build (next)
          prerelease: true
          make_latest: false
          body: |
            Newest build of the `next` branch, commit ${{ github.sha }}.
            Replaced on every push; versioned releases (max-v*) stay.

            - `*-merged.bin`: first flash, write at 0x0
            - `*.bin`: update (OTA, Launcher, or write at 0x10000)

            `meck_max_ui2` is the new UI; the others keep the classic UI.
            The companion builds have Bluetooth and WiFi, both usable at
            the same time and both off until turned on.
          files: out/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/max-v')
    runs-on: ubuntu-latest
    steps:

      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true

      - name: Create Draft Release
        uses: softprops/action-gh-release@v2
        with:
          name: T-Deck MAX ${{ github.ref_name }}
          draft: true
          body: |
            T-Deck MAX firmwares built from `${{ github.ref_name }}`.

            - `*-merged.bin`: first flash, write at 0x0
            - `*.bin`: update (OTA, Launcher, or write at 0x10000)

            `meck_max_ui2` is the new UI; the others keep the classic UI.
            The companion builds have Bluetooth and WiFi, both usable at
            the same time and both off until turned on.
          files: out/*
